<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Xavier's Node Project</title>
  </head>
  <body>
    <h1>Welcome to PlanetCoder-X!</h1>
    <hr />
    <p id="message"></p>
    <div id="login-register" style="display: none">
      <button type="button" id="login">Login</button>
      <button type="button" id="register">Register</button>
    </div>
    <div id="login-div" style="display: none">
      <form>
        <div>
          <label for="password">password:</label>
          <input type="password" id="password" />
        </div>
      </form>
    </div>
    <div id="register-div" style="display: none">
      <form>
        <div>
          <label for="username">username:</label>
          <input type="text" id="username" />
        </div>
        <div>
          <label for="password1">password:</label>
          <input type="password" id="password1" />
        </div>
        <div>
          <label for="password2">verify password:</label>
          <input type="password" id="password2" />
        </div>
        <button type="button" id="register-button">register</button>
        <button type="button" id="register-cancel">cancel</button>
      </form>
      <div id="notes" style="display: none">
        <p id="forms-message"></p>
        <table id="forms-table">
          <tr id="forms-table-header">
            <th>Your Full Name</th>
            <th>Your likes</th>
            <th>Status</th>
            <th colspan="2"></th>
          </tr>
        </table>
        <button type="button" id="add-note">Add a note</button>
        <button type="button" id="logoff">Log off</button>
      </div>
      <div id="edit-note" style="display: none">
        <form>
          <div>
            <label for="name">Name:</label>
            <input type="text" id="name" />
          </div>
          <div>
            <label for="likes">Your likes:</label>
            <input type="text" id="likes" />
          </div>
          <div>
            <label for="status">status:</label>
            <select id="status">
              <option value="pending">pending</option>
              <option value="approved">approved</option>
              <option value="declined">declined</option>
            </select>
          </div>
          <button type="button" id="adding-note">add</button>
          <button type="button" id="edit-cancel">cancel</button>
        </form>
      </div>
    </div>
    <script src="./index.js" type="module">
      let activeDiv = null;
      export const setDiv = (newDiv) => {
          if (newDiv != activeDiv) {
              if (activeDiv) {
                  activeDiv.style.display = "none";
              }
              newDiv.style.display = "block";
              activeDiv = newDiv;
          }
      };

      export let inputEnabled = true;
      export const enableInput = (state) => {
          inputEnabled = state;
      };

      export let token = null;
      export const setToken = (value) => {
        token = value;
        if (value) {
            localStorage.setItem("token", value);
        } else {
            localStorage.removeItem("token");
        }
      };

      export let message = null;

      import { showForms, handleForms } from "./forms.js";
      import { showLoginRegister, handleLoginRegister } from "./loginRegister.js";
      import { handleLogin } from "./login.js";
      import { handleAddEdit } from "./addEdit.js";
      import { handleRegister } from "./register.js";

      document.addEventListener("DOMContentLoaded", () => {
        token = localStorage.getItem("token");
        message = document.getElementById("message");
        handleLoginRegister();
        handleLogin();
        handleForms();
        handleRegister();
        handleAddEdit();
        if (token) {
            showForms();
        } else {
            showLoginRegister();
        }
      });
    </script>
  </body>
</html>
